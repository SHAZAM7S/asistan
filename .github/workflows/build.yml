name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Turkce modeli indir
        run: |
          mkdir -p app/src/main/assets
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip
          unzip -q vosk-model-small-tr-0.3.zip
          mv vosk-model-small-tr-0.3 app/src/main/assets/model-tr
          uuidgen > app/src/main/assets/model-tr/uuid

      - name: Derle
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: asistan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
